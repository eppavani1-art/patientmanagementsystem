
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Patient Management System</h1>
        <p>Manage Hospital Patient Records</p>

        <div class="form-box">
            <h2 id="formTitle">Add New Patient</h2>

            <form id="patientForm">

                <input type="hidden" id="editIndex">

                <label>Patient ID</label>
                <input type="text" id="patientId"
                       placeholder="Enter Patient ID" required>

                <label>Patient Name</label>
                <input type="text" id="name"
                       placeholder="Enter Patient Name" required>

                <label>Age</label>
                <input type="number" id="age"
                       placeholder="Enter Age" min="1" required>

                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <label>Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter Phone Number"
                       pattern="[0-9]{10}" required>

                <label>Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>

                <button type="submit" id="submitBtn">
                    Add Patient
                </button>

                <button type="button" id="cancelBtn"
                        onclick="resetForm()" hidden>
                    Cancel
                </button>
            </form>
        </div>

        <div class="table-box">
            <h2>Patient Records</h2>

            <input type="text" id="search"
                   placeholder="Search patient..."
                   oninput="displayPatients()">

            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Blood Group</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="patientList">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
